<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Content-Security-Policy: VITE_CSP from .env.production (builds) or .env.development (dev server) -->
    <meta http-equiv="Content-Security-Policy" content="%VITE_CSP%" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Realist tracks home sale prices in Philadelphia, New York City and Chicago from public records, refreshed daily by an automated data pipeline." />
    <!-- fonts are self-hosted (src/fonts.css); most pages open on a map, so start the tile connection early -->
    <link rel="preconnect" href="https://tile.openstreetmap.org" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="theme-color" content="#121416" />
    <title>Realist | Home sale analytics from public records</title>
    <!-- theme before first paint (?theme=, else the saved choice, else dark); blocking on purpose -->
    <script src="./theme.js"></script>
    <!-- page colour before the stylesheet and React load, so there is no flash -->
    <style>html { background: #121416; color-scheme: dark; } html[data-theme="light"] { background: #eef2ef; color-scheme: light; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
