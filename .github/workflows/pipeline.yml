name: Data pipeline

# Harvests new public records every day, checks them, and republishes the site.
# The harvest store lives on the `data` branch; the site is deployed to GitHub Pages.

on:
  schedule:
    - cron: "17 9 * * *"        # daily, 09:17 UTC (early morning US Eastern)
  workflow_dispatch:
    inputs:
      full:
        description: "Re-pull the full history instead of the recent window"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["engine/**", "web/**", ".github/workflows/pipeline.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Check out the harvest store (data branch)
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git clone --depth 1 --branch data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" store
          else
            mkdir store && cd store && git init -q -b data
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Optional engine extras (Parquet export for the Explore page)
        run: pip install duckdb || echo "::warning::duckdb not installed; the Explore page will read the CSV files"

      - name: Engine tests
        run: python -m unittest discover -s engine/tests -v

      - name: Harvest, validate and build analytics
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}   # optional, raises API rate limits
        run: python -m engine run ${{ inputs.full && '--full' || '' }}

      - name: Save the harvest store
        if: always()
        run: |
          cd store
          git config user.name "realist-pipeline"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Store unchanged."
          else
            git commit -q -m "Harvest $(date -u +%Y-%m-%dT%H:%MZ)"
            # the Photo tags workflow also pushes to this branch (listing-analysis/ only), so rebase and retry
            for attempt in 1 2 3; do
              if git ls-remote --exit-code --heads origin data >/dev/null; then git pull -q --rebase origin data; fi
              git push -q origin HEAD:data && break
              if [ "$attempt" = 3 ]; then echo "::error::Could not push the harvest store"; exit 1; fi
              sleep $((attempt * 10))
            done
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/cache/restore@v4
        with:
          path: harvested-listings
          key: listings-v1-read-${{ github.run_id }}
          restore-keys: listings-v1-

      # Snapshots come from the "Harvest live listings" workflow's cache. With an empty cache (first run, or
      # the cache expired after 7 idle days) this reads one publisher per city; a city that still has no
      # snapshot shows the site's unavailable state rather than failing the build.
      - name: Include latest city listing snapshots
        run: |
          for city in philadelphia nyc chicago; do
            snapshot="harvested-listings/$city/new-listings.json"
            if [ ! -s "$snapshot" ]; then
              python -m engine.live_listings --city "$city" --output harvested-listings || echo "::warning::Could not refresh $city listings"
            fi
            # The raw snapshot holds publishers' full descriptions and photo links, so it is never copied into
            # the site. The pages read listing-cards.json, which carries only our own figures and short quotes.
            mkdir -p "web/public/data/$city"
            rm -f "web/public/data/$city/new-listings.json" "web/public/data/$city/listings.json"
          done
          # Listing tags: text signals for every city, plus the photo tags and defect crops the Photo tags workflow
          # keeps on the data branch (store/listing-analysis); writes <city>/listing-tags.json and analysis/crops/.
          python -m engine.listing_analysis --no-photos --output web/public/data --listings harvested-listings \
            --cache-dir store/listing-analysis || echo "::warning::Could not build listing tags"
          # The New listings page's cards: merged listings + this run's area figures and price model (and tags if present)
          python -m engine.listing_cards --output web/public/data --listings harvested-listings --store store || echo "::warning::Could not build listing cards"

      # Publish guard: only defect crops may ship; held photos (engine/photo_hold.py) and publisher photo URLs in the
      # analysis store must never reach the site or the data branch.
      - name: Check that no held photo is published
        run: python -m engine.photo_hold --check web/public/data --check-store store/listing-analysis

      - name: Build the site
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  # Deploys in its own job: the site artifact is only reliably visible to the deploy step once the job that
  # uploaded it has finished.
  deploy:
    needs: run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
