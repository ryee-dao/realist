name: Data pipeline

# Harvests new public records every day, checks them, and republishes the site.
# The harvest store lives on the `data` branch; the site is deployed to GitHub Pages.

on:
  schedule:
    - cron: "17 9 * * *"        # daily, 09:17 UTC (early morning US Eastern)
  workflow_dispatch:
    inputs:
      full:
        description: "Re-pull the full history instead of the recent window"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["engine/**", "web/**", ".github/workflows/pipeline.yml"]
  # After each listings harvest (four a day) the site is rebuilt so new homes show up the same day. These runs
  # do not contact the cities' record systems again: they rebuild from the stored records (see the harvest step).
  workflow_run:
    workflows: ["Harvest live listings"]
    types: [completed]

permissions: {}      # each job below asks only for what it needs

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    # a harvest that failed has nothing new to publish
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write   # push the harvest store to the data branch
      pages: read       # configure-pages reads the Pages settings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false   # the store clone below carries its own token; this checkout never pushes

      - name: Check out the harvest store (data branch)
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git clone --depth 1 --branch data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" store
          else
            mkdir store && cd store && git init -q -b data
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.12"

      - name: Optional engine extras (Parquet export for the Explore page)
        run: pip install duckdb || echo "::warning::duckdb not installed; the Explore page will read the CSV files"

      - name: Engine tests
        run: python -m unittest discover -s engine/tests -v

      - name: Harvest, validate and build analytics
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}   # optional, raises API rate limits
          HUD_CENSUS_API_KEY: ${{ secrets.HUD_CENSUS_API_KEY }}   # optional HUD USER API token: Small Area Fair Market Rents
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}   # optional; without it the ACS Summary File is read instead
          FULL: ${{ inputs.full }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_run" ]; then
            # started by a listings harvest: rebuild from the store without fetching public records again
            python -m engine build
            exit
          fi
          args=()
          if [ "$FULL" = "true" ]; then args+=(--full); fi
          python -m engine run "${args[@]}"

      - name: Save the harvest store
        if: always()
        run: |
          cd store
          git config user.name "realist-pipeline"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Store unchanged."
          else
            git commit -q -m "Harvest $(date -u +%Y-%m-%dT%H:%MZ)"
            # the Photo tags workflow also pushes to this branch (listing-analysis/ only), so rebase and retry
            for attempt in 1 2 3; do
              if git ls-remote --exit-code --heads origin data >/dev/null; then git pull -q --rebase origin data; fi
              git push -q origin HEAD:data && break
              if [ "$attempt" = 3 ]; then echo "::error::Could not push the harvest store"; exit 1; fi
              sleep $((attempt * 10))
            done
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - id: listings
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        with:
          path: sealed/listings
          key: listings-v2-read-${{ github.run_id }}
          restore-keys: listings-v2-
      - name: Open the listings cache
        env:
          REALIST_CACHE_KEY: ${{ secrets.REALIST_CACHE_KEY }}
        run: bash .github/scripts/sealed-cache.sh open harvested-listings sealed/listings
      # One-time move from the old unsealed cache (listings-v1-), until the listings harvest has written a sealed one.
      - if: steps.listings.outputs.cache-matched-key == ''
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        with:
          path: harvested-listings
          key: listings-v1-none
          restore-keys: listings-v1-

      # Snapshots come from the "Harvest live listings" workflow's cache. With an empty cache (first run, or
      # the cache expired after 7 idle days) this reads one publisher per city; a city that still has no
      # snapshot shows the site's unavailable state rather than failing the build.
      - name: Include latest city listing snapshots
        env:
          REALIST_LISTING_TRANSPORT: patchright
        run: |
          browser_installed=false
          for city in philadelphia nyc chicago; do
            snapshot="harvested-listings/$city/new-listings.json"
            if [ ! -s "$snapshot" ]; then
              if [ "$browser_installed" = false ]; then
                python -m pip install -r engine/listing_sources/requirements-browser.txt
                browser_installed=true
              fi
              python -m engine.live_listings --city "$city" --output harvested-listings || echo "::warning::Could not refresh $city listings"
            fi
            # The raw snapshot holds publishers' full descriptions and photo links, so it is never copied into
            # the site. The pages read listing-cards.json, which carries only our own figures and short quotes.
            mkdir -p "web/public/data/$city"
            rm -f "web/public/data/$city/new-listings.json" "web/public/data/$city/listings.json"
          done
          # Listing tags: text signals for every city, plus the photo tags and defect crops the Photo tags workflow
          # keeps on the data branch (store/listing-analysis); writes <city>/listing-tags.json and analysis/crops/.
          python -m engine.listing_analysis --no-photos --output web/public/data --listings harvested-listings \
            --cache-dir store/listing-analysis || echo "::warning::Could not build listing tags"
          # The New listings page's cards: merged listings + this run's area figures and price model (and tags if present)
          python -m engine.listing_cards --output web/public/data --listings harvested-listings --store store || echo "::warning::Could not build listing cards"
          # These were only inputs to the two steps above; no page reads them, so they are not published.
          # Philadelphia's sales.json stays: the Photo tags workflow fetches it from the deployed site.
          for city in philadelphia nyc chicago; do
            rm -f "web/public/data/$city/listing-tags.json" "web/public/data/$city/model-residuals.json" \
                  "web/public/data/$city/model-predictor.json"
            if [ "$city" != philadelphia ]; then rm -f "web/public/data/$city/sales.json"; fi
          done

      # Publish guard: only defect crops may ship; held photos (engine/photo_hold.py) and publisher photo URLs in the
      # analysis store must never reach the site or the data branch.
      - name: Check that no held photo is published
        run: python -m engine.photo_hold --check web/public/data --check-store store/listing-analysis

      - name: Build the site
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b   # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa   # v3.0.1
        with:
          path: web/dist

  # Deploys in its own job: the site artifact is only reliably visible to the deploy step once the job that
  # uploaded it has finished.
  deploy:
    needs: run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write      # publish the site
      id-token: write   # Pages deployment proves its origin with an OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e   # v4.0.5
