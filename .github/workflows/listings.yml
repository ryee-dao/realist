name: Harvest live listings

# Four light runs a day. Each run reads one publisher per city (the one tried longest ago), so eligible publishers
# take turns across runs. Times are 07:23, 11:23, 15:23 and 19:23 US Eastern (EST).
on:
  schedule:
    - cron: "23 0,12,16,20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-listings-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: harvested-listings
          key: listings-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: listings-v1-
      # Homes harvested elsewhere, slimmed to facts the site already shows (python -m engine.live_listings
      # --export-seed), pushed to listing-seed/ on the data branch. Only homes the store does not hold are added,
      # so re-importing the same seed every run changes nothing.
      - name: Import the listing seed, if the data branch has one
        continue-on-error: true
        run: |
          if git fetch --quiet --depth 1 origin data 2>/dev/null && git cat-file -e FETCH_HEAD:listing-seed 2>/dev/null; then
            mkdir -p "$RUNNER_TEMP/seed"
            git archive FETCH_HEAD listing-seed | tar -x -C "$RUNNER_TEMP/seed"
            python -m engine.live_listings --import-seed "$RUNNER_TEMP/seed/listing-seed" --output harvested-listings
          else
            echo "No listing-seed/ on the data branch."
          fi
      # The cache carries the snapshots and each city's harvest-state.json (rotation and cool-downs) between runs.
      # The command also rebuilds <city>/listing-cards.json; with no area data here those cards are bare, and the
      # Data pipeline workflow rebuilds them with the area figures and price model before it deploys the site.
      - id: listings
        name: Refresh listings and galleries
        continue-on-error: true
        run: python -m engine.live_listings --output harvested-listings
      - name: Summarize the hosted scout
        if: always()
        run: |
          python - <<'PYTHON' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          print("| City | Source | Snapshot | Listings | With photos | With descriptions |")
          print("|---|---|---|---:|---:|---:|")
          for city in ("philadelphia", "nyc", "chicago"):
              file = Path("harvested-listings") / city / "new-listings.json"
              snapshot = json.loads(file.read_text()) if file.exists() else {}
              rows = snapshot.get("rows", [])
              status = "stale" if snapshot.get("stale") else snapshot.get("status", "missing")
              print(f"| {city} | {snapshot.get('source', '—')} | {status} | {len(rows)} | "
                    f"{sum(bool(r.get('photos')) for r in rows)} | {sum(bool(r.get('description')) for r in rows)} |")
          PYTHON
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: harvested-listings
          key: listings-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        with:
          name: live-listings
          path: harvested-listings/
          retention-days: 2
          if-no-files-found: error
      - if: steps.listings.outcome == 'failure'
        run: exit 1
